name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Generate sample data
        run: PYTHONPATH=src python -m astraflow.generator --days 2 --orders-per-day 100 --customers 250 --products 60 --seed 11 --out data/raw
      - name: Validate data
        run: PYTHONPATH=src python -m astraflow.quality --data-dir data/raw --report reports/quality_report.json
      - name: Build warehouse
        run: PYTHONPATH=src python -m astraflow.warehouse --data-dir data/raw --db data/warehouse/astraflow.duckdb --export-dir data/lake/gold
      - name: Unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
